<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 移动端适配：禁缩放、cover 安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7F0">
  <title>每日一束花</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- 开场问候「啵啵~」 -->
  <div id="greeting">
    <!-- 装饰层：柔光斑 + 唇印 + 星光，纯装饰不接收点击 -->
    <div id="greetDeco" aria-hidden="true">
      <span class="bokeh b1"></span>
      <span class="bokeh b2"></span>
      <span class="bokeh b3"></span>

      <svg id="greetKiss" viewBox="0 0 120 88" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="kissG" x1="0" y1="0" x2="0.2" y2="1">
            <stop offset="0%" stop-color="#FBAEC3"/>
            <stop offset="55%" stop-color="#EE7C9E"/>
            <stop offset="100%" stop-color="#D9557B"/>
          </linearGradient>
          <filter id="kissSoft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.15"/>
          </filter>
        </defs>
        <g filter="url(#kissSoft)" fill="url(#kissG)">
          <path d="M6 36C6 36 22 10 38 16c6 2 10 7 22 7s16-5 22-7c16-6 32 20 32 20s-24 8-54 8S6 36 6 36Z" opacity="0.94"/>
          <path d="M12 48c18-4 32-5 48-5s30 1 48 5c-4 20-24 34-48 34S16 68 12 48Z" opacity="0.88"/>
        </g>
        <g fill="#FFF3F6" opacity="0.16">
          <ellipse cx="38" cy="26" rx="9" ry="3.2" transform="rotate(-16 38 26)"/>
          <ellipse cx="80" cy="27" rx="8" ry="2.8" transform="rotate(14 80 27)"/>
        </g>
      </svg>

      <i class="sp lg" style="left:12%;top:22%;width:22px;height:22px;--d:2.6s;--delay:0.10s"></i>
      <i class="sp " style="left:24%;top:13%;width:14px;height:14px;--d:2.9s;--delay:0.70s"></i>
      <i class="sp " style="left:38%;top:9%;width:16px;height:16px;--d:3.2s;--delay:0.35s"></i>
      <i class="sp " style="right:48%;top:17%;width:12px;height:12px;--d:3.6s;--delay:1.25s"></i>
      <i class="sp " style="right:34%;top:11%;width:15px;height:15px;--d:3.9s;--delay:0.55s"></i>
      <i class="sp lg" style="right:20%;top:19%;width:19px;height:19px;--d:4.2s;--delay:1.60s"></i>
      <i class="sp " style="right:10%;top:32%;width:13px;height:13px;--d:4.5s;--delay:2.10s"></i>
      <i class="sp " style="left:8%;top:38%;width:16px;height:16px;--d:2.6s;--delay:1.05s"></i>
      <i class="sp " style="left:19%;top:45%;width:11px;height:11px;--d:2.9s;--delay:2.50s"></i>
      <i class="sp " style="right:14%;top:44%;width:14px;height:14px;--d:3.2s;--delay:0.20s"></i>
      <i class="sp lg" style="right:7%;top:55%;width:17px;height:17px;--d:3.6s;--delay:1.40s"></i>
      <i class="sp " style="left:14%;top:64%;width:13px;height:13px;--d:3.9s;--delay:1.85s"></i>
      <i class="sp lg" style="left:26%;top:71%;width:18px;height:18px;--d:4.2s;--delay:0.95s"></i>
      <i class="sp " style="left:41%;top:67%;width:12px;height:12px;--d:4.5s;--delay:2.20s"></i>
      <i class="sp " style="right:45%;top:73%;width:15px;height:15px;--d:2.6s;--delay:0.45s"></i>
      <i class="sp " style="right:31%;top:65%;width:11px;height:11px;--d:2.9s;--delay:1.70s"></i>
      <i class="sp " style="right:19%;top:71%;width:16px;height:16px;--d:3.2s;--delay:2.65s"></i>
      <i class="sp " style="right:9%;top:63%;width:12px;height:12px;--d:3.6s;--delay:1.15s"></i>
      <i class="sp " style="left:22%;top:82%;width:14px;height:14px;--d:3.9s;--delay:0.60s"></i>
      <i class="sp " style="left:48%;top:86%;width:12px;height:12px;--d:4.2s;--delay:1.95s"></i>
      <i class="sp " style="right:28%;top:84%;width:15px;height:15px;--d:4.5s;--delay:2.40s"></i>
      <i class="dot" style="left:18%;top:33%;width:6px;height:6px;--d:4.6s;--delay:0.20s"></i>
      <i class="dot" style="left:34%;top:57%;width:5px;height:5px;--d:4.9s;--delay:1.40s"></i>
      <i class="dot" style="right:38%;top:60%;width:6px;height:6px;--d:5.3s;--delay:2.60s"></i>
      <i class="dot" style="right:12%;top:36%;width:5px;height:5px;--d:5.6s;--delay:3.20s"></i>
      <i class="dot" style="left:46%;top:78%;width:5px;height:5px;--d:6.0s;--delay:0.90s"></i>
      <i class="dot" style="right:24%;top:52%;width:6px;height:6px;--d:4.6s;--delay:2.00s"></i>
    </div>

    <div id="greetingText"></div>
    <div id="greetingSub"></div>
  </div>

  <!-- 主场景 -->
  <div id="main">
    <div class="header">
      <div class="date-label" id="dateLabel"></div>
    </div>

    <!-- 今日花束：先手写 dc，再淡入鲜花 -->
    <div id="bouquetWrap">
      <div id="handwrite"></div>
      <div id="bouquetBox"></div>
    </div>

    <!-- 花名与 mood -->
    <div class="flower-info" id="flowerInfo">
      <span id="flowerName"></span>
      <span id="moodTag"></span>
    </div>

    <!-- 爱情文案 -->
    <div class="quote-card" id="quoteCard">
      <p id="quote"></p>
    </div>

    <!-- 操作按钮 -->
    <div class="actions">
      <button class="btn btn-ghost" id="btnHistory">花语收藏</button>
      <button class="btn btn-primary" id="btnCollect">
        <span id="btnCollectText">领取今日鲜花</span>
      </button>
      <button class="btn btn-ghost" id="btnShare">分享</button>
    </div>
  </div>

  <!-- 收藏册弹层（含数据查询入口） -->
  <div id="historySheet">
    <div class="sheet">
      <div class="sheet-header">
        <h2>花语收藏册</h2>
        <button class="sheet-close" id="historyClose">✕</button>
      </div>
      <div class="stats" id="historyStats"></div>
      <div id="historyList"></div>
    </div>
  </div>

  <!-- 领取后的俏皮小弹窗 -->
  <div id="loveModal">
    <div class="love-card">
      <div class="love-heart">
        <svg viewBox="0 0 48 44" aria-hidden="true">
          <defs>
            <linearGradient id="heartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FFB6CB"/>
              <stop offset="100%" stop-color="#E8547F"/>
            </linearGradient>
          </defs>
          <path d="M24 42S2 28.5 2 14.5C2 7.6 7.6 2 14.5 2 18.6 2 22.2 3.9 24 6.9 25.8 3.9 29.4 2 33.5 2 40.4 2 46 7.6 46 14.5 46 28.5 24 42 24 42Z"
                fill="url(#heartGrad)" stroke="#D2466F" stroke-width="2" stroke-linejoin="round"/>
          <ellipse cx="15" cy="13" rx="5" ry="3.4" fill="#fff" opacity="0.55" transform="rotate(-25 15 13)"/>
        </svg>
      </div>
      <p class="love-text" id="loveText">亲爱的，我爱你</p>
      <button class="love-btn" id="loveClose">收下这束花</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <!-- 配置表 + 花卉引擎 + 主逻辑（相对路径，零 CDN） -->
  <script src="./js/config.js"></script>
  <script src="./js/flowers.js"></script>
  <script src="./js/game.js"></script>
</body>
</html>
